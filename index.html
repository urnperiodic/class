<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom</title>
<style>
:root{font-size:.09765625vw;color-scheme:light;--canvas:#f8fafd;--blue:#0b57d0;--ink:#202124}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:8rem;border-top:2rem solid #45494d;min-height:100vh}button,a{font:inherit}button{cursor:pointer}button{color:inherit}button:focus-visible,a:focus-visible{outline:2rem solid var(--blue);outline-offset:3rem}button{border:0;background:none}a{text-decoration:none;color:inherit}.icon{width:12rem;height:12rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.topbar{height:32rem;display:flex;align-items:center;padding:0 10rem;gap:11rem}.icon-button{width:18rem;height:24rem;padding:3rem;display:grid;place-items:center;border-radius:50%}.icon-button:hover{background:#e9eef6}.menu-button{margin-right:0}.brand{display:flex;align-items:center;gap:6rem;font-size:12rem;color:#424548;letter-spacing:-.2rem}.brand-image{position:relative;overflow:hidden;width:14rem;height:14rem}.reference-part{position:absolute;max-width:none;width:1024rem;height:466rem;pointer-events:none}.brand-image img{left:-36rem;top:-10rem}.header-actions{margin-left:auto;display:flex;align-items:center;gap:5rem}.header-actions .icon{width:11rem;height:11rem}.avatar{border-radius:50%;width:16rem;height:16rem;overflow:hidden;position:relative;margin-left:4rem;padding:0}.avatar img{left:-998rem;top:-10rem}.sidebar{position:fixed;top:40rem;left:0;width:150rem;padding-right:6rem}.navigation-item{height:24rem;width:144rem;display:flex;align-items:center;gap:11rem;padding:0 14rem;text-align:left;border-radius:0 20rem 20rem 0;font-size:7rem}.navigation-item .icon{width:11rem;height:11rem}.navigation-item.selected{background:#c2e7ff;color:#003d54;margin-left:6rem;width:138rem;padding-left:8rem}.navigation-item:hover:not(.selected){background:#edf1f7}.navigation-divider{height:9rem}.page-content{margin-left:144rem;width:calc(100% - 150rem);padding-top:36rem}.dashboard{width:642rem;margin:0 auto;display:grid;gap:13rem}.panel{position:relative;border-radius:17rem;background:#fff;padding:11rem 14rem}.panel h1,.panel h2{font-size:11rem;font-weight:400;line-height:14rem;margin:0;letter-spacing:-.22rem}.due-panel{height:56rem}.tools-panel{height:67rem}.panel-heading{display:flex;align-items:center;justify-content:space-between;height:14rem}.panel-actions{display:flex;align-items:center;gap:17rem}.text-button{color:#064fae;padding:3rem 0;font-size:7rem;white-space:nowrap}.text-button:hover{text-decoration:underline}.collapse-button{width:10rem;height:12rem;padding:0;color:#5f6368;display:grid;place-items:center}.collapse-button .icon{width:9rem;height:9rem;stroke-width:1}.empty-message{text-align:center;margin:9rem 0 0;font-size:8rem;line-height:12rem;color:#303134}.tools-panel .empty-message{margin-top:8rem}.heading-with-info{display:flex;align-items:center;gap:6rem}.info-button{padding:0;display:grid;place-items:center}.info-button .icon{width:9rem;height:9rem;stroke-width:1.4}.classes-panel{height:222rem}.add-class-button{display:flex;align-items:center;gap:5rem;margin-right:8rem}.add-class-button .icon{width:8rem;height:8rem;stroke-width:1.2}.empty-classes{display:flex;flex-direction:column;align-items:center;padding-top:15rem}.illustration{width:108rem;height:114rem;position:relative;overflow:hidden;flex-shrink:0}.illustration img{left:-529rem;top:-256rem}.empty-caption{font-size:8rem;line-height:12rem;margin:10rem 0 9rem}.class-actions{display:flex;align-items:center;gap:14rem}.primary-button{background:var(--blue);color:#fff;border-radius:20rem;padding:6rem 13rem;font-size:7rem;line-height:9rem;min-height:21rem}.primary-button:hover{background:#084bb6}.class-actions .text-button{font-size:7rem}.help-button{position:fixed;right:9rem;bottom:9rem;width:18rem;height:18rem;border-radius:50%;background:#fff;display:grid;place-items:center;padding:3rem;box-shadow:0 1rem 4rem #e9edf3}.help-button .icon{width:11rem;height:11rem}.dropdown{position:absolute;z-index:5;right:8rem;top:34rem;background:white;border-radius:6rem;box-shadow:0 3rem 14rem #20212430;padding:5rem 0;min-width:110rem}.dropdown button{display:block;width:100%;text-align:left;padding:9rem 14rem;font-size:9rem}.dropdown button:hover{background:#f1f3f4}[hidden]{display:none!important}dialog{border:1px solid #dadce0;border-radius:16px;padding:24px;width:min(420px,90vw);font-size:14px;color:var(--ink);box-shadow:0 10px 50px #0002}dialog::backdrop{background:#20212466}dialog h2{font-size:22px;font-weight:400;margin:0 0 20px}dialog p{line-height:1.6}dialog label{display:block;margin:18px 0 8px}dialog input{width:100%;padding:12px;border:1px solid #747775;border-radius:5px;font:inherit}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}dialog button{padding:10px 18px;border-radius:20px;color:var(--blue)}dialog .confirm{background:var(--blue);color:white}dialog .notice{font-size:12px;color:#5f6368}.sidebar-hidden .sidebar{display:none}.sidebar-hidden .page-content{margin-left:0;width:100%}.alternate-panel{min-height:222rem}.alternate-panel p{margin-top:35rem;text-align:center;font-size:9rem}.panel.is-collapsed{height:36rem}.panel.is-collapsed .empty-message{display:none}
@media(max-width:600px){:root{font-size:1px}.topbar{height:52rem;padding:0 15rem}.brand{font-size:18rem}.header-actions{gap:10rem}.sidebar{display:none;top:54rem;background:var(--canvas);height:calc(100vh - 54rem);z-index:10;width:180rem;box-shadow:8rem 5rem 20rem #20212412;padding-top:12rem}.navigation-item{height:40rem;width:174rem;font-size:11rem}.navigation-item.selected{width:168rem}.navigation-item .icon{width:15rem;height:15rem}.mobile-sidebar-open .sidebar{display:block}.page-content{margin-left:0;width:100%;padding:20rem 14rem}.dashboard{width:100%;gap:14rem}.panel{padding:16rem;border-radius:18rem}.panel h1,.panel h2{font-size:14rem}.due-panel{height:91rem}.tools-panel{height:98rem}.empty-message{font-size:10rem;margin-top:20rem}.tools-panel .empty-message{margin-top:20rem}.text-button{font-size:9rem}.classes-panel{height:267rem}.empty-classes{padding-top:24rem}.empty-caption{font-size:10rem;margin-top:15rem}.primary-button{font-size:10rem;padding:9rem 16rem}.class-actions .text-button{font-size:10rem}.help-button{width:28rem;height:28rem;right:15rem;bottom:15rem}.help-button .icon{width:15rem;height:15rem}.panel-actions{gap:12rem}.panel.is-collapsed{height:49rem}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-8 9 8v11h-7v-7h-4v7H3Z"/></symbol>
<symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="17" rx="1"/><path d="M7 2v5M17 2v5M3 9h18"/></symbol>
<symbol id="archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 8h18M12 10v7m-3-3 3 3 3-3"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="m9 2-.7 3-2 .9-2.6-.8-2 3.5 2 2.2v2.4l-2 2.2 2 3.5 2.6-.8 2 .9L9 22h4l.7-3 2-.9 2.6.8 2-3.5-2-2.2v-2.4l2-2.2-2-3.5-2.6.8-2-.9L13 2Z"/><circle cx="11" cy="12" r="3"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.1"/></symbol>
<symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 0 1 6 0c0 3-3 2-3 5M12 17v.1"/></symbol>
<symbol id="collapse" viewBox="0 0 24 24"><path d="M5 3v6H0M19 21v-6h5M4 9l5-5M20 15l-5 5"/></symbol>
<symbol id="apps" viewBox="0 0 24 24"><path stroke-width="3" d="M5 5h.1M12 5h.1M19 5h.1M5 12h.1M12 12h.1M19 12h.1M5 19h.1M12 19h.1M19 19h.1"/></symbol>
</defs></svg>
<header class="topbar">
<button class="icon-button menu-button" id="navigation-toggle" aria-label="Main menu" aria-expanded="true"><svg class="icon"><use href="#menu"/></svg></button>
<a class="brand" href="./index.html" aria-label="Classroom home"><span class="brand-image"><img class="reference-part" src="https://gensparkpublicblob.blob.core.windows.net/user-upload-image/v1/fafd3616-882f-48a0-b3c8-54e23a1bb82c" alt=""></span>Classroom</a>
<div class="header-actions"><button class="icon-button" id="header-add" aria-label="Create or join a class" aria-expanded="false"><svg class="icon"><use href="#plus"/></svg></button><button class="icon-button" id="apps-button" aria-label="Google apps"><svg class="icon"><use href="#apps"/></svg></button><button class="avatar" id="profile-button" aria-label="Google account"><img class="reference-part" src="https://gensparkpublicblob.blob.core.windows.net/user-upload-image/v1/fafd3616-882f-48a0-b3c8-54e23a1bb82c" alt="Profile"></button></div>
</header>
<nav class="sidebar" aria-label="Main navigation">
<button class="navigation-item selected" data-page="Home" aria-current="page"><svg class="icon"><use href="#home"/></svg>Home</button>
<button class="navigation-item" data-page="Calendar"><svg class="icon"><use href="#calendar"/></svg>Calendar</button>
<div class="navigation-divider"></div>
<button class="navigation-item" data-page="Archived classes"><svg class="icon"><use href="#archive"/></svg>Archived classes</button>
<button class="navigation-item" data-page="Settings"><svg class="icon"><use href="#settings"/></svg>Settings</button>
</nav>
<main class="page-content">
<div class="dashboard" id="home-dashboard">
<section class="panel due-panel" id="due-soon"><div class="panel-heading"><h2>Due soon</h2><div class="panel-actions"><button class="text-button" id="view-todo">View To-do</button><button class="collapse-button" aria-label="Collapse Due soon" aria-expanded="true"><svg class="icon"><use href="#collapse"/></svg></button></div></div><p class="empty-message">You don't have any work due in the next 7 days</p></section>
<section class="panel tools-panel" id="class-learning-tools"><div class="panel-heading"><div class="heading-with-info"><h2>Class learning tools</h2><button class="info-button" id="tools-info" aria-label="About class learning tools"><svg class="icon"><use href="#info"/></svg></button></div><button class="collapse-button" aria-label="Collapse Class learning tools" aria-expanded="true"><svg class="icon"><use href="#collapse"/></svg></button></div><p class="empty-message">You don't have any assigned class learning tools</p></section>
<section class="panel classes-panel" id="classes"><div class="panel-heading"><h1>Classes</h1><button class="text-button add-class-button" id="add-class" aria-expanded="false"><svg class="icon"><use href="#plus"/></svg>Add class</button></div><div class="empty-classes"><div class="illustration" role="img" aria-label="A window, books, a yellow mug and a little plant"><img class="reference-part" src="https://gensparkpublicblob.blob.core.windows.net/user-upload-image/v1/fafd3616-882f-48a0-b3c8-54e23a1bb82c" alt=""></div><p class="empty-caption">Add a class to get started</p><div class="class-actions"><button class="text-button" data-action="create">Create class</button><button class="primary-button" data-action="join">Join class</button></div></div></section>
</div>
<section class="dashboard" id="alternate-view" hidden><div class="panel alternate-panel"><h1 id="alternate-title"></h1><p id="alternate-message"></p><button class="text-button" id="back-home">Back to Home</button></div></section>
</main>
<div class="dropdown" id="class-menu" hidden><button data-action="create">Create class</button><button data-action="join">Join class</button></div>
<button class="help-button" id="help-button" aria-label="Help"><svg class="icon"><use href="#help"/></svg></button>
<dialog id="class-dialog" aria-labelledby="dialog-title"><form id="class-form"><h2 id="dialog-title"></h2><p id="dialog-description"></p><div id="dialog-field"><label for="class-input" id="class-input-label"></label><input id="class-input" autocomplete="off"><p class="notice">This is a visual replica, not connected to Google Classroom.</p></div><p id="dialog-feedback" role="status"></p><div class="dialog-actions"><button type="button" id="dialog-close">Cancel</button><button type="submit" class="confirm" id="dialog-confirm">Join</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);const dialog=$('class-dialog');let action='';
function showDialog(title,description,mode=''){action=mode;$('dialog-title').textContent=title;$('dialog-description').textContent=description;$('dialog-field').hidden=!mode;$('dialog-confirm').hidden=!mode;$('dialog-close').textContent=mode?'Cancel':'Close';$('dialog-feedback').textContent='';$('class-input').value='';$('class-input').required=!!mode;$('class-input-label').textContent=mode==='join'?'Class code':'Class name';$('dialog-confirm').textContent=mode==='join'?'Join':'Create';dialog.showModal();}
function showPage(page){const isHome=page==='Home';$('home-dashboard').hidden=!isHome;$('alternate-view').hidden=isHome;$('alternate-title').textContent=page;const messages={'Calendar':'No upcoming class events.','Archived classes':'You don’t have any archived classes.','Settings':'This visual replica is not connected to a Google account.','To-do':'You don’t have any assigned work.'};$('alternate-message').textContent=messages[page]||'';document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('selected',el.dataset.page===page);if(el.dataset.page===page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});document.body.classList.remove('mobile-sidebar-open');}
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));$('back-home').onclick=()=>showPage('Home');$('view-todo').onclick=()=>showPage('To-do');
$('navigation-toggle').onclick=()=>{const mobile=matchMedia('(max-width:600px)').matches;document.body.classList.toggle(mobile?'mobile-sidebar-open':'sidebar-hidden');$('navigation-toggle').setAttribute('aria-expanded',mobile?document.body.classList.contains('mobile-sidebar-open'):!document.body.classList.contains('sidebar-hidden'));};
function toggleMenu(event){event.stopPropagation();const rect=event.currentTarget.getBoundingClientRect();const menu=$('class-menu');menu.hidden=!menu.hidden;menu.style.top=(rect.bottom+5)+'px';menu.style.right=(innerWidth-rect.right)+'px';event.currentTarget.setAttribute('aria-expanded',!menu.hidden);}
$('add-class').onclick=toggleMenu;$('header-add').onclick=toggleMenu;document.addEventListener('click',()=>{$('class-menu').hidden=true;$('add-class').setAttribute('aria-expanded','false');$('header-add').setAttribute('aria-expanded','false');});
document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>el.dataset.action==='join'?showDialog('Join class','Ask your teacher for the class code, then enter it here.','join'):showDialog('Create class','Enter a name for your class.','create'));
$('dialog-close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
$('class-form').onsubmit=e=>{e.preventDefault();$('dialog-feedback').textContent=action==='join'?'Joining a real class requires Google Classroom. This replica does not submit your code.':'Creating a real class requires Google Classroom. This replica does not submit your information.';};
$('tools-info').onclick=()=>showDialog('Class learning tools','Learning tools assigned to your classes appear here.');$('help-button').onclick=()=>showDialog('Classroom help','Use Create class or Join class to explore the interface. This page is a visual recreation of the supplied reference, not the Google Classroom service.');$('profile-button').onclick=()=>showDialog('Google account','No Google account is connected to this visual replica.');$('apps-button').onclick=()=>showDialog('Google apps','Google apps are not connected to this visual replica.');
document.querySelectorAll('.collapse-button').forEach(el=>el.onclick=()=>{const collapsed=el.closest('.panel').classList.toggle('is-collapsed');el.setAttribute('aria-expanded',!collapsed);el.setAttribute('aria-label',(collapsed?'Expand ':'Collapse ')+el.closest('.panel').querySelector('h2').textContent);});
</script>
</body>
</html>
